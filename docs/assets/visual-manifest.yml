# Visual manifest for the documentation guide.
#
# Every teaching visual is planned here BEFORE it is produced. Capture is
# manual, so a wrong screenshot is expensive; deciding what a visual must show,
# and reviewing that decision, is cheaper than re-shooting it.
#
# Validate with:
#   python tools/docs/validate_visual_manifest.py .
#
# Fields
#   id         unique slug, also the filename stem
#   type       screenshot | diagram | generated | mermaid   (see the validator)
#   path       repo-relative, under docs/assets/. Omitted for mermaid.
#   pages      every page that embeds it
#   fixture    which synthetic input produces it   (screenshots only)
#   ui_state   the exact state to capture          (screenshots only)
#   regenerate the command that rebuilds it        (generated only)
#   callouts   overlay labels, applied in HTML rather than burned into the image
#   alt        what the image shows, for screen readers
#   caption    the teaching point, shown under the image
#   status     planned -> captured -> approved. Only `approved` may be embedded.
#
# Publication safety, enforced by review at the Phase 4 gate: no API keys, no
# real survey coordinates, no unstable job ids, no real scans without explicit
# per-image approval, no filesystem paths containing a username.

