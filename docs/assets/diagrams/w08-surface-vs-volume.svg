  <rect x="880" y="168" width="34" height="58" fill="var(--band-b)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="916" y="168" width="34" height="58" fill="var(--band-b)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="556" y="228" width="34" height="58" fill="var(--band-c)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="592" y="228" width="34" height="58" fill="var(--band-c)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="628" y="228" width="34" height="58" fill="var(--band-c)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="664" y="228" width="34" height="58" fill="var(--band-c)" stroke="var(--edge)" stroke-width="1.5"/>
