<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d">
  <title id="t">A well-drawn sheet compared with a problematic one</title>
  <desc id="d">A sheet with a scale bar, closed boundaries, and legible locus labels beside one with broken boundaries and no scale or labels.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="1000" height="390" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">What makes a sheet extractable</text>
  <rect x="40" y="56" width="440" height="250" rx="6" class="panel"/>
  <text x="56" y="82" text-anchor="start" class="bold good-f">Works well</text>
  <rect x="60" y="100" width="400" height="56" fill="var(--band-a)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="60" y="156" width="400" height="62" fill="var(--band-b)" stroke="var(--edge)" stroke-width="1.5"/>
  <path d="M60,156 Q93.33333333333334,162 126.66666666666667,156 Q160.0,150 193.33333333333334,156 Q226.66666666666669,162 260.0,156 Q293.33333333333337,150 326.6666666666667,156 Q360.0,162 393.33333333333337,156 Q426.6666666666667,150 460.0,156" class="edge"/>
  <line x1="60" y1="240" x2="160" y2="240" class="good"/>
  <line x1="60" y1="234" x2="60" y2="246" class="good"/>
  <line x1="160" y1="234" x2="160" y2="246" class="good"/>
  <text x="168" y="245" text-anchor="start" class="sm good-f">scale bar</text>
  <text x="60" y="274" text-anchor="start" class="mono">L1 · 10YR 5/4</text>
  <text x="60" y="296" text-anchor="start" class="sm muted">boundaries closed and continuous</text>
  <rect x="530" y="56" width="440" height="250" rx="6" class="panel"/>
  <text x="546" y="82" text-anchor="start" class="bold warn-f">Causes trouble</text>
  <rect x="550" y="100" width="400" height="56" fill="var(--band-a)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="550" y="156" width="400" height="62" fill="var(--band-b)" stroke="var(--edge)" stroke-width="1.5"/>
  <path d="M550,156 L640,160 L700,152" class="warn"/>
  <path d="M760,158 L860,150 L950,160" class="warn"/>
  <text x="700" y="200" text-anchor="middle" class="sm warn-f">boundary breaks</text>
  <text x="550" y="274" text-anchor="start" class="sm warn-f">no scale, no locus label</text>
  <text x="550" y="296" text-anchor="start" class="sm muted">and scanned below 300 DPI</text>
  <text x="24" y="350" text-anchor="start" class="sm muted">Most extraction failures start on the sheet. A missing scale cannot be recovered later,</text>
  <text x="24" y="370" text-anchor="start" class="sm muted">and a broken boundary becomes a gap the model silently interpolates across.</text>
</svg>
