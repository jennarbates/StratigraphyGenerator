<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" role="img" aria-labelledby="t d">
  <title id="t">The five capability status labels</title>
  <desc id="d">A grid separating supported, backend-only, blocked, and historical by whether a user control and a backend implementation exist, with experimental noted as cutting across the grid.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="900" height="406" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">What the five capability labels mean</text>
  <text x="300" y="76" text-anchor="middle" class="bold sm">Backend implemented</text>
  <text x="640" y="76" text-anchor="middle" class="bold sm">Backend absent or unusable</text>
  <text x="150" y="150" text-anchor="middle" class="bold sm">User control exists</text>
  <text x="150" y="280" text-anchor="middle" class="bold sm">No user control</text>
  <rect x="230" y="100" width="280" height="100" rx="6" class="panel"/>
  <text x="370" y="138" text-anchor="middle" class="bold good-f">supported</text>
  <text x="370" y="162" text-anchor="middle" class="sm muted">wired end to end</text>
  <rect x="230" y="220" width="280" height="100" rx="6" class="panel"/>
  <text x="370" y="258" text-anchor="middle" class="bold">backend-only</text>
  <text x="370" y="282" text-anchor="middle" class="sm muted">routes exist, nothing reaches them</text>
  <rect x="540" y="100" width="280" height="100" rx="6" class="panel"/>
  <text x="680" y="138" text-anchor="middle" class="bold warn-f">blocked</text>
  <text x="680" y="162" text-anchor="middle" class="sm muted">advertised, but cannot complete</text>
  <rect x="540" y="220" width="280" height="100" rx="6" class="panel"/>
  <text x="680" y="258" text-anchor="middle" class="bold muted">historical</text>
  <text x="680" y="282" text-anchor="middle" class="sm muted">kept only as reference</text>
  <line x1="230" y1="210" x2="820" y2="210" class="thin"/>
  <line x1="530" y1="100" x2="530" y2="320" class="thin"/>
  <text x="24" y="366" text-anchor="start" class="sm muted">experimental cuts across the grid: user-facing, but dependent on an optional package,</text>
  <text x="24" y="386" text-anchor="start" class="sm muted">an API key, or a path not yet covered well enough to depend on.</text>
</svg>
