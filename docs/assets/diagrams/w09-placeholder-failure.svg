<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d">
  <title id="t">Correct registration compared with placeholder registration</title>
  <desc id="d">On the left four walls enclosing a pit; on the right the same walls laid out as parallel lines because every face shares the placeholder bearing.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="1000" height="380" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">Why placeholder registration is fatal for a merged build</text>
  <rect x="40" y="56" width="420" height="250" rx="6" class="panel"/>
  <text x="56" y="82" text-anchor="start" class="bold good-f">Real registration</text>
  <rect x="160" y="130" width="180" height="120" class="fill"/>
  <line x1="160" y1="130" x2="340" y2="130" class="good"/>
  <line x1="160" y1="250" x2="340" y2="250" class="good"/>
  <line x1="160" y1="130" x2="160" y2="250" class="good"/>
  <line x1="340" y1="130" x2="340" y2="250" class="good"/>
  <text x="250" y="194" text-anchor="middle" class="sm">walls around a pit</text>
  <text x="56" y="292" text-anchor="start" class="sm muted">four distinct bearings and origins</text>
  <rect x="530" y="56" width="420" height="250" rx="6" class="panel"/>
  <text x="546" y="82" text-anchor="start" class="bold warn-f">Starter placeholders left in place</text>
  <line x1="570" y1="130" x2="880" y2="130" class="warn"/>
  <text x="890" y="135" text-anchor="start" class="sm muted">wall 1</text>
  <line x1="570" y1="172" x2="880" y2="172" class="warn"/>
  <text x="890" y="177" text-anchor="start" class="sm muted">wall 2</text>
  <line x1="570" y1="214" x2="880" y2="214" class="warn"/>
  <text x="890" y="219" text-anchor="start" class="sm muted">wall 3</text>
  <line x1="570" y1="256" x2="880" y2="256" class="warn"/>
  <text x="890" y="261" text-anchor="start" class="sm muted">wall 4</text>
  <text x="546" y="292" text-anchor="start" class="sm muted">identical bearing 90: every wall parallel</text>
  <text x="24" y="340" text-anchor="start" class="sm muted">Every face carries the same 0, 0, 100, 90, so the walls lie in a row about 10 m apart</text>
  <text x="24" y="360" text-anchor="start" class="sm muted">instead of around a pit. The build refuses rather than producing a confident model of nothing.</text>
</svg>
