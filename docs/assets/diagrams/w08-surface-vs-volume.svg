  <rect x="736" y="168" width="34" height="58" fill="var(--band-b)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="772" y="168" width="34" height="58" fill="var(--band-b)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="808" y="168" width="34" height="58" fill="var(--band-b)" stroke="var(--edge)" stroke-width="1.5"/>
