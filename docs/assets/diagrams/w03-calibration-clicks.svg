<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
  <title id="t">The three calibration clicks</title>
  <desc id="d">A trench drawing with three numbered calibration points: two defining a known horizontal distance, and a third setting the depth reference.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">Three clicks turn pixels into metres</text>
  <rect x="40" y="50" width="520" height="300" rx="6" class="fill"/>
  <rect x="60" y="90" width="480" height="70" fill="var(--band-a)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="60" y="160" width="480" height="90" fill="var(--band-b)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="60" y="250" width="480" height="80" fill="var(--band-c)" stroke="var(--edge)" stroke-width="1.5"/>
  <path d="M60,160 Q100.0,166 140.0,160 Q180.0,154 220.0,160 Q260.0,166 300.0,160 Q340.0,154 380.0,160 Q420.0,166 460.0,160 Q500.0,154 540.0,160" class="edge"/>
  <path d="M60,250 Q100.0,256 140.0,250 Q180.0,244 220.0,250 Q260.0,256 300.0,250 Q340.0,244 380.0,250 Q420.0,256 460.0,250 Q500.0,244 540.0,250" class="edge"/>
  <circle cx="110" cy="100" r="7" class="accent-f"/>
  <text x="110" y="84" text-anchor="middle" class="bold accent-f">1</text>
  <circle cx="470" cy="100" r="7" class="accent-f"/>
  <text x="470" y="84" text-anchor="middle" class="bold accent-f">2</text>
  <circle cx="300" cy="330" r="7" class="accent-f"/>
  <text x="300" y="352" text-anchor="middle" class="bold accent-f">3</text>
  <line x1="110" y1="100" x2="470" y2="100" class="accent dash"/>
  <text x="290" y="118" text-anchor="middle" class="sm accent-f">a distance you measured on the sheet</text>
  <text x="600" y="80" text-anchor="start" class="bold">Click 1 and 2</text>
  <text x="600" y="102" text-anchor="start" class="sm">Two points a known real</text>
  <text x="600" y="120" text-anchor="start" class="sm">distance apart. This sets</text>
  <text x="600" y="138" text-anchor="start" class="sm">the scale.</text>
  <text x="600" y="180" text-anchor="start" class="bold">Click 3</text>
  <text x="600" y="202" text-anchor="start" class="sm">The lowest point anywhere</text>
  <text x="600" y="220" text-anchor="start" class="sm">on the drawing. This sets</text>
  <text x="600" y="238" text-anchor="start" class="sm">the depth reference.</text>
  <text x="600" y="285" text-anchor="start" class="bold">Then type the width</text>
  <text x="600" y="307" text-anchor="start" class="sm">The real distance between</text>
  <text x="600" y="325" text-anchor="start" class="sm">clicks 1 and 2, in metres.</text>
  <text x="24" y="382" text-anchor="start" class="sm muted">Clicks too close together make the scale unstable; spread them out.</text>
</svg>
