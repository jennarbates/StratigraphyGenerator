  <text x="56" y="306" text-anchor="start" class="sm accent-f">one sheet may hold several faces</text>
  <rect x="530" y="56" width="440" height="260" rx="6" class="panel"/>
  <text x="546" y="82" text-anchor="start" class="bold">Hand-drawn field sheet</text>
  <text x="546" y="102" text-anchor="start" class="sm muted">layers identified by locus number and Munsell</text>
  <rect x="550" y="118" width="400" height="56" fill="var(--band-a)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="550" y="174" width="400" height="62" fill="var(--band-b)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="550" y="236" width="400" height="56" fill="var(--band-c)" stroke="var(--edge)" stroke-width="1.5"/>
  <text x="566" y="150" text-anchor="start" class="mono">L1 · 10YR 5/4</text>
  <text x="566" y="210" text-anchor="start" class="mono">L2 · 7.5YR 4/3</text>
  <text x="566" y="270" text-anchor="start" class="mono">L3 · 10YR 3/2</text>
  <text x="546" y="306" text-anchor="start" class="sm accent-f">one sheet records exactly one wall</text>
  <text x="24" y="350" text-anchor="start" class="sm muted">They use different extraction schemas because they record material differently — but both</text>
  <text x="24" y="370" text-anchor="start" class="sm muted">converge on the same coordinate conversion and model build.</text>
