<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 380" role="img" aria-labelledby="t d">
  <title id="t">The four registration fields</title>
  <desc id="d">A plan view showing originX, originY and bearing measured clockwise from north, beside a section view showing surfaceZ and depth.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="1010" height="380" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">Four numbers place one face on the site</text>
  <text x="60" y="70" text-anchor="start" class="bold">Plan view, looking down</text>
  <line x1="60" y1="100" x2="60" y2="300" class="thin"/>
  <line x1="60" y1="300" x2="330" y2="300" class="thin"/>
  <text x="46" y="96" text-anchor="end" class="sm muted">Y</text>
  <text x="338" y="304" text-anchor="start" class="sm muted">X</text>
  <line x1="120" y1="250" x2="290" y2="160" class="accent"/>
  <circle cx="120" cy="250" r="6" class="accent-f"/>
  <text x="112" y="272" text-anchor="middle" class="sm accent-f">originX, originY</text>
  <text x="258" y="172" text-anchor="middle" class="sm">the face</text>
  <line x1="120" y1="250" x2="120" y2="150" class="thin dot"/>
  <text x="126" y="146" text-anchor="start" class="sm muted">north</text>
  <path d="M120,196 A54,54 0 0,1 166,222" class="warn"/>
  <text x="176" y="214" text-anchor="start" class="sm warn-f">bearing_deg</text>
  <text x="430" y="70" text-anchor="start" class="bold">Section view, looking at the face</text>
  <line x1="430" y1="120" x2="760" y2="120" class="edge"/>
  <text x="430" y="110" text-anchor="start" class="sm">ground surface  =  surfaceZ</text>
  <rect x="430" y="122" width="330" height="60" fill="var(--band-a)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="430" y="182" width="330" height="80" fill="var(--band-b)" stroke="var(--edge)" stroke-width="1.5"/>
  <path d="M430,182 Q457.5,188 485.0,182 Q512.5,176 540.0,182 Q567.5,188 595.0,182 Q622.5,176 650.0,182 Q677.5,188 705.0,182 Q732.5,176 760.0,182" class="edge"/>
  <line x1="800" y1="120" x2="800" y2="262" class="edge"/>
  <line x1="792" y1="120" x2="808" y2="120" class="edge"/>
  <text x="812" y="124" text-anchor="start" class="sm">Z = surfaceZ</text>
  <text x="812" y="196" text-anchor="start" class="sm">Z = surfaceZ − depth</text>
  <text x="430" y="292" text-anchor="start" class="sm muted">x runs along the face from originX, originY</text>
  <text x="24" y="340" text-anchor="start" class="sm muted">bearing_deg is the compass direction of the face's local +x axis,</text>
  <text x="24" y="360" text-anchor="start" class="sm muted">measured clockwise from north — not a slope and not a screen angle.</text>
</svg>
