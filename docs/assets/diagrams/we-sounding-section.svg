<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">Section through the synthetic sounding</title>
  <desc id="d">A section down the western edge of a two metre sounding, showing three recorded surfaces bounding two excavated layers above an unexcavated one, with the elevation of each surface labelled at both ends.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">The sounding, west edge: four surfaces, three of them shared</text>
  <path d="M130.0,110.00000000000114 L490.0,169.99999999999986 L490.0,235.00000000000114 L130.0,210.0000000000008 Z" fill="var(--band-b)" stroke="var(--edge)" stroke-width="1.5"/>
  <path d="M130.0,210.0000000000008 L490.0,235.00000000000114 L490.0,349.99999999999955 L130.0,294.9999999999999 Z" fill="var(--band-c)" stroke="var(--edge)" stroke-width="1.5"/>
  <path d="M130.0,294.9999999999999 L490.0,349.99999999999955 L490.0,374.99999999999994 L130.0,374.99999999999994 Z" fill="var(--band-d)" stroke="var(--edge)" stroke-width="1.5"/>
  <line x1="130.0" y1="110.00000000000114" x2="490.0" y2="169.99999999999986" class="edge"/>
  <text x="118.0" y="114.00000000000114" text-anchor="end" class="mono">23.99</text>
  <text x="502.0" y="173.99999999999986" text-anchor="start" class="mono">23.87</text>
  <text x="556.0" y="173.99999999999986" text-anchor="start" class="sm muted">Locus 6 opening (the floor surface)</text>
  <line x1="130.0" y1="210.0000000000008" x2="490.0" y2="235.00000000000114" class="edge"/>
  <text x="118.0" y="214.0000000000008" text-anchor="end" class="mono">23.79</text>
  <text x="502.0" y="239.00000000000114" text-anchor="start" class="mono">23.74</text>
  <text x="556.0" y="239.00000000000114" text-anchor="start" class="sm muted">Locus 6 closing = Locus 7 opening</text>
  <line x1="130.0" y1="294.9999999999999" x2="490.0" y2="349.99999999999955" class="edge"/>
  <text x="118.0" y="298.9999999999999" text-anchor="end" class="mono">23.62</text>
  <text x="502.0" y="353.99999999999955" text-anchor="start" class="mono">23.51</text>
  <text x="556.0" y="353.99999999999955" text-anchor="start" class="sm muted">Locus 7 closing = Locus 8 opening</text>
  <text x="130.0" y="60" text-anchor="middle" class="sm muted">22S</text>
  <text x="490.0" y="60" text-anchor="middle" class="sm muted">24S</text>
  <text x="310.0" y="155.00000000000108" text-anchor="middle" class="sm bold">Locus 6</text>
  <text x="310.0" y="265.0000000000005" text-anchor="middle" class="sm bold">Locus 7</text>
  <text x="310.0" y="349.99999999999955" text-anchor="middle" class="sm bold">Locus 8 (unexcavated)</text>
  <text x="24" y="424" text-anchor="start" class="sm">One locus's closing surface is the next one's opening surface, at all four corners. Nothing is interpolated here:</text>
  <text x="24" y="444" text-anchor="start" class="sm">every line is two recorded elevations joined. Locus 6 measures 0.20 m thick at the northwest corner and 0.13 m at the southwest,</text>
  <text x="24" y="464" text-anchor="start" class="sm">so the season's single stated figure of “about 20 cm” describes one corner rather than the layer.</text>
  <text x="24" y="500" text-anchor="start" class="sm muted">Synthetic example. Every elevation is invented and none of it is archaeological evidence.</text>
</svg>
