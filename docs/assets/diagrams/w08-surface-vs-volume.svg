<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="t d">
  <title id="t">Surface mode compared with volume mode</title>
  <desc id="d">The same model shown as smooth interpolated boundary surfaces and as a grid of resolution-dependent classified cells.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="1000" height="360" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">Two ways to view one model</text>
  <rect x="40" y="50" width="430" height="250" rx="6" class="panel"/>
  <text x="56" y="76" text-anchor="start" class="bold">Surface mode</text>
  <polyline points="70,130 150,118 230,140 310,126 400,146" class="accent"/>
  <polyline points="70,190 150,202 230,182 310,200 400,188" class="accent"/>
  <polyline points="70,250 150,244 230,258 310,246 400,262" class="accent"/>
  <text x="56" y="288" text-anchor="start" class="sm muted">interpolated boundaries; resolution-independent</text>
  <rect x="530" y="50" width="430" height="250" rx="6" class="panel"/>
  <text x="546" y="76" text-anchor="start" class="bold">Volume mode</text>
  <rect x="556" y="108" width="34" height="58" fill="var(--band-a)" stroke="var(--edge)" stroke-width="1.5"/>
