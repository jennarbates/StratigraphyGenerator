<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 305" role="img" aria-labelledby="t d">
  <title id="t">From excavated wall to 3D model</title>
  <desc id="d">Four panels in sequence: the excavated trench wall, its measured drawing, the structured coordinate data, and the interpolated model.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="1000" height="305" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">Four representations of one trench</text>
  <rect x="40" y="60" width="200" height="170" rx="6" class="panel"/>
  <text x="140" y="90" text-anchor="middle" class="bold">The trench wall</text>
  <text x="140" y="218" text-anchor="middle" class="sm muted">what was excavated</text>
  <rect x="280" y="60" width="200" height="170" rx="6" class="panel"/>
  <text x="380" y="90" text-anchor="middle" class="bold">The drawing</text>
  <text x="380" y="218" text-anchor="middle" class="sm muted">measured by hand on site</text>
  <rect x="520" y="60" width="200" height="170" rx="6" class="panel"/>
  <text x="620" y="90" text-anchor="middle" class="bold">Structured data</text>
  <text x="620" y="218" text-anchor="middle" class="sm muted">boundaries as coordinates</text>
  <rect x="760" y="60" width="200" height="170" rx="6" class="panel"/>
  <text x="860" y="90" text-anchor="middle" class="bold">The model</text>
  <text x="860" y="218" text-anchor="middle" class="sm muted">interpolated geometry</text>
  <rect x="56" y="108" width="168" height="30" fill="var(--band-a)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="56" y="138" width="168" height="36" fill="var(--band-b)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="56" y="174" width="168" height="28" fill="var(--band-c)" stroke="var(--edge)" stroke-width="1.5"/>
  <path d="M296,130 Q317.0,134 338.0,130 Q359.0,126 380.0,130 Q401.0,134 422.0,130 Q443.0,126 464.0,130" class="edge"/>
  <path d="M296,172 Q317.0,176 338.0,172 Q359.0,168 380.0,172 Q401.0,176 422.0,172 Q443.0,168 464.0,172" class="edge"/>
  <rect x="296" y="106" width="168" height="96" class="thin"/>
  <circle cx="540" cy="126" r="3" class="accent-f"/>
  <circle cx="564" cy="146" r="3" class="accent-f"/>
  <circle cx="588" cy="166" r="3" class="accent-f"/>
  <circle cx="612" cy="126" r="3" class="accent-f"/>
  <circle cx="636" cy="146" r="3" class="accent-f"/>
  <circle cx="660" cy="166" r="3" class="accent-f"/>
  <circle cx="684" cy="126" r="3" class="accent-f"/>
  <text x="620" y="186" text-anchor="middle" class="mono muted">"xMeters": 2.10</text>
  <text x="620" y="202" text-anchor="middle" class="mono muted">"depthMeters": 0.85</text>
  <polyline points="776,180 826,164 876,186 926,170" class="accent"/>
  <polyline points="776,132 826,120 876,140 926,126" class="accent"/>
  <line x1="248" y1="145" x2="274" y2="145" class="edge" marker-end="url(#arrow)"/>
  <line x1="488" y1="145" x2="514" y2="145" class="edge" marker-end="url(#arrow)"/>
  <line x1="728" y1="145" x2="754" y2="145" class="edge" marker-end="url(#arrow)"/>
  <text x="24" y="268" text-anchor="start" class="sm muted">Each step loses something. The project's job is to record what was lost, so the model</text>
  <text x="24" y="288" text-anchor="start" class="sm muted">can be judged against the drawing it came from rather than trusted on its own.</text>
</svg>
