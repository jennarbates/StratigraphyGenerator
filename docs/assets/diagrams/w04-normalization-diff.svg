<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d">
  <title id="t">Extraction data before and after normalization</title>
  <desc id="d">The same extraction record shown before and after normalization, with the cleaned null-like string and trimmed description highlighted and the boundary coordinates unchanged.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="1000" height="340" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">Normalization cleans formatting, not geometry</text>
  <rect x="40" y="56" width="430" height="210" rx="6" class="panel"/>
  <text x="56" y="82" text-anchor="start" class="bold">Before</text>
  <text x="56" y="112" text-anchor="start" class="mono">{</text>
  <text x="56" y="136" text-anchor="start" class="mono">  "locusNumber": "L1",</text>
  <text x="56" y="160" text-anchor="start" class="mono">  "munsell": "null",</text>
  <text x="56" y="184" text-anchor="start" class="mono">  "description": "  loose fill ",</text>
  <text x="56" y="208" text-anchor="start" class="mono">  "topBoundary": [ … ]</text>
  <text x="56" y="232" text-anchor="start" class="mono">}</text>
  <rect x="530" y="56" width="430" height="210" rx="6" class="panel"/>
  <text x="546" y="82" text-anchor="start" class="bold">After</text>
  <text x="546" y="112" text-anchor="start" class="mono">{</text>
  <text x="546" y="136" text-anchor="start" class="mono">  "locusNumber": "L1",</text>
  <text x="546" y="160" text-anchor="start" class="mono good-f">  "munsell": null,</text>
  <text x="546" y="184" text-anchor="start" class="mono good-f">  "description": "loose fill",</text>
  <text x="546" y="208" text-anchor="start" class="mono">  "topBoundary": [ … ]</text>
  <text x="546" y="232" text-anchor="start" class="mono">}</text>
  <line x1="482" y1="160" x2="518" y2="160" class="accent" marker-end="url(#arrow-a)"/>
  <text x="24" y="300" text-anchor="start" class="sm muted">The null-like string "null" becomes a real null and the padded description is trimmed.</text>
  <text x="24" y="320" text-anchor="start" class="sm muted">topBoundary is passed through untouched — normalization never moves a coordinate.</text>
</svg>
