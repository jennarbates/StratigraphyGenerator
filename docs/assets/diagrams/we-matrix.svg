<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 548" role="img" aria-labelledby="t d">
  <title id="t">Harris matrix of the synthetic trench T905</title>
  <desc id="d">A Harris matrix with eight loci running from topsoil at the top to an unexcavated layer at the bottom, two of them joined by a dashed correlation, and one dashed edge marked as asserted but dropped from the display.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="1000" height="548" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">T905's matrix: one correlation, one redundant edge</text>
  <rect x="368" y="50" width="124" height="40" rx="6" class="panel"/>
  <text x="430" y="75" text-anchor="middle" class="sm bold">Locus 1</text>
  <rect x="368" y="130" width="124" height="40" rx="6" class="panel"/>
  <text x="430" y="155" text-anchor="middle" class="sm bold">Locus 2</text>
  <rect x="128" y="215" width="124" height="40" rx="6" class="panel"/>
  <text x="190" y="240" text-anchor="middle" class="sm bold">Locus 5</text>
  <rect x="328" y="215" width="124" height="40" rx="6" class="fill"/>
  <text x="390" y="240" text-anchor="middle" class="sm bold">Locus 3</text>
  <rect x="488" y="215" width="124" height="40" rx="6" class="fill"/>
  <text x="550" y="240" text-anchor="middle" class="sm bold">Locus 6</text>
  <rect x="688" y="215" width="124" height="40" rx="6" class="panel"/>
  <text x="750" y="240" text-anchor="middle" class="sm bold">Locus 4</text>
  <rect x="408" y="300" width="124" height="40" rx="6" class="panel"/>
  <text x="470" y="325" text-anchor="middle" class="sm bold">Locus 7</text>
  <rect x="408" y="380" width="124" height="40" rx="6" class="panel"/>
  <text x="470" y="405" text-anchor="middle" class="sm bold">Locus 8</text>
  <line x1="430" y1="90" x2="430" y2="130" class="edge" marker-end="url(#arrow)"/>
  <line x1="430" y1="170" x2="190" y2="215" class="edge" marker-end="url(#arrow)"/>
  <line x1="430" y1="170" x2="390" y2="215" class="edge" marker-end="url(#arrow)"/>
  <line x1="430" y1="170" x2="750" y2="215" class="edge" marker-end="url(#arrow)"/>
  <line x1="550" y1="255" x2="470" y2="300" class="edge" marker-end="url(#arrow)"/>
  <line x1="470" y1="340" x2="470" y2="380" class="edge" marker-end="url(#arrow)"/>
  <line x1="452" y1="235" x2="488" y2="235" class="accent dash"/>
  <text x="470" y="214" text-anchor="middle" class="sm accent-f">equal to</text>
  <path d="M612,250 Q700,340 534,398" class="warn dash"/>
  <text x="660" y="300" text-anchor="start" class="sm warn-f">6 → 8: asserted,</text>
  <text x="660" y="320" text-anchor="start" class="sm warn-f">then dropped</text>
  <line x1="80" y1="70" x2="80" y2="400" class="accent" marker-end="url(#arrow-a)"/>
  <text x="70" y="70" text-anchor="end" class="sm accent-f">younger</text>
  <text x="70" y="400" text-anchor="end" class="sm accent-f">older</text>
  <text x="24" y="452" text-anchor="start" class="sm">Loci 3 and 6 are one deposit under two numbers: 6 is the piece of 3 the sounding removed. Both SU forms say so, and a correlation is</text>
  <text x="24" y="472" text-anchor="start" class="sm">what the schema has for it — the drawn matrix stacked them instead, which would make a deposit younger than itself. Locus 6's form also</text>
  <text x="24" y="492" text-anchor="start" class="sm">asserts it overlies 8 as well as 7; that follows from 6 → 7 → 8, so it is kept in the record and omitted from the diagram with a warning.</text>
  <text x="24" y="528" text-anchor="start" class="sm muted">Synthetic example. Invented loci; not an archaeological interpretation.</text>
</svg>
