<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a trench section</title>
  <desc id="d">A stratigraphic section with four layers, the boundaries between them, an internal feature, and labels naming layer, boundary, feature, locus, and face.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="980" height="420" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">One trench section, with every term it defines</text>
  <rect x="60" y="60" width="480" height="60" fill="var(--band-a)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="60" y="120" width="480" height="70" fill="var(--band-b)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="60" y="190" width="480" height="80" fill="var(--band-c)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="60" y="270" width="480" height="60" fill="var(--band-d)" stroke="var(--edge)" stroke-width="1.5"/>
  <path d="M60,120 Q100.0,126 140.0,120 Q180.0,114 220.0,120 Q260.0,126 300.0,120 Q340.0,114 380.0,120 Q420.0,126 460.0,120 Q500.0,114 540.0,120" class="edge"/>
  <path d="M60,190 Q100.0,196 140.0,190 Q180.0,184 220.0,190 Q260.0,196 300.0,190 Q340.0,184 380.0,190 Q420.0,196 460.0,190 Q500.0,184 540.0,190" class="edge"/>
  <path d="M60,270 Q100.0,276 140.0,270 Q180.0,264 220.0,270 Q260.0,276 300.0,270 Q340.0,264 380.0,270 Q420.0,276 460.0,270 Q500.0,264 540.0,270" class="edge"/>
  <ellipse cx="300" cy="225" rx="46" ry="26" class="fill"/>
  <text x="300" y="230" text-anchor="middle" class="sm">feature</text>
  <line x1="600" y1="90" x2="548" y2="90" class="edge" marker-end="url(#arrow)"/>
  <text x="608" y="95" text-anchor="start">layer: one deposit</text>
  <line x1="600" y1="150" x2="548" y2="128" class="edge" marker-end="url(#arrow)"/>
  <text x="608" y="155" text-anchor="start">boundary: the surface between two</text>
  <line x1="600" y1="225" x2="350" y2="225" class="edge" marker-end="url(#arrow)"/>
  <text x="608" y="230" text-anchor="start">feature: inclusion inside a layer</text>
  <line x1="600" y1="300" x2="548" y2="300" class="edge" marker-end="url(#arrow)"/>
  <text x="608" y="305" text-anchor="start">locus: the excavator's number</text>
  <line x1="60" y1="345" x2="540" y2="345" class="thin"/>
  <text x="300" y="368" text-anchor="middle" class="sm muted">face: one wall of the trench, drawn on one sheet</text>
  <text x="24" y="400" text-anchor="start" class="sm muted">The trench is the whole excavated hole; this is one of its faces.</text>
</svg>
