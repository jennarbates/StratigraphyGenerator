[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poggio-civitate"
version = "0.1.0"
description = "Trench digitization pipeline — archaeological section drawings to 3D models"
requires-python = ">=3.11"

# Mirrors poggio_webapp/requirements.txt. Keep the two in sync until that file
# is retired in favour of this one.
dependencies = [
    "flask",
    "opencv-python-headless",
    "numpy",
    "pandas",
    "pillow",
    "google-genai",
    "pydantic",
    "pdf2image",
]

[project.optional-dependencies]
# Stage 06 (3D model) only. Heavy install, kept optional so the rest of the
# pipeline works without it.
model = [
    "gempy",
    "gempy_viewer",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pymdown-extensions==11.0.1",
    "PyYAML==6.0.3",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
# Explicit discovery: the repo root holds docs/, site/, tools/ and sample data
# alongside the package, so auto-discovery would either fail or sweep in dirs
# that are not Python packages.
package-dir = { "" = "poggio_webapp" }
packages = ["backend", "backend.routes", "pipeline"]
py-modules = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Replaces the sys.path.insert() block that used to be copy-pasted into every
# test module:
#   "poggio_webapp" -> backend, pipeline, app
#   "tests"         -> fixtures_merge (shared test data)
#   "."             -> tools.docs (exercised by tests/docs/)
pythonpath = ["poggio_webapp", "tests", "."]

[tool.ruff]
line-length = 88
extend-exclude = [".archive", "poggio_webapp/static/vendor", "site"]

[tool.ruff.lint]
# Deliberately close to ruff's defaults plus import hygiene. F401/F811 are the
# ones that matter most here: the Phase 1-3 moves shifted a lot of imports
# around, and an unused or shadowed import is the first sign one was missed.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length: the existing code wraps by judgement, not column
    "B008",   # function call in default arg — Flask/pydantic idiom
    # zip(..., strict=): a good rule for new code, but the honest fix at each
    # of the 22 existing sites is strict=True, and turning a silent truncation
    # into an exception is a behaviour change that needs its own commit and its
    # own tests. Left on so it is a deliberate decision, not an oversight.
    "B905",
    # Imports below module level are deliberate here: gempy is an optional
    # extra that must not be imported to save a session, and the pydantic
    # schema modules are loaded only when finalizing.
    "E402",
    # str+Enum -> StrEnum changes what str(Member) returns ("Class.MEMBER" vs
    # "MEMBER"), which these values are serialised with. Not a safe autofix.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["backend", "pipeline", "storage", "naming", "app"]

[tool.ruff.lint.per-file-ignores]
# Re-export surfaces: these exist precisely to expose names they do not use.
"poggio_webapp/pipeline/editor/__init__.py" = ["F401"]
"poggio_webapp/backend/services/__init__.py" = ["F401"]
