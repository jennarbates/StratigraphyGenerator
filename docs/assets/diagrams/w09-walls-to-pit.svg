<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="t d">
  <title id="t">Four registered walls enclosing one trench</title>
  <desc id="d">Four separate wall drawings joined by a shared trench label and placed by their registration so they enclose one rectangular pit.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="900" height="370" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">Four sheets, correctly registered, enclose one pit</text>
  <text x="40" y="66" text-anchor="start" class="bold sm">Four drawings, each its own job</text>
  <rect x="40" y="80" width="92" height="66" rx="6" class="fill"/>
  <text x="86" y="108" text-anchor="middle" class="sm bold">North</text>
  <text x="86" y="128" text-anchor="middle" class="sm muted">one wall</text>
  <line x1="86" y1="152" x2="86" y2="176" class="edge" marker-end="url(#arrow)"/>
  <rect x="145" y="80" width="92" height="66" rx="6" class="fill"/>
  <text x="191" y="108" text-anchor="middle" class="sm bold">East</text>
  <text x="191" y="128" text-anchor="middle" class="sm muted">one wall</text>
  <line x1="191" y1="152" x2="191" y2="176" class="edge" marker-end="url(#arrow)"/>
  <rect x="250" y="80" width="92" height="66" rx="6" class="fill"/>
  <text x="296" y="108" text-anchor="middle" class="sm bold">South</text>
  <text x="296" y="128" text-anchor="middle" class="sm muted">one wall</text>
  <line x1="296" y1="152" x2="296" y2="176" class="edge" marker-end="url(#arrow)"/>
  <rect x="355" y="80" width="92" height="66" rx="6" class="fill"/>
  <text x="401" y="108" text-anchor="middle" class="sm bold">West</text>
  <text x="401" y="128" text-anchor="middle" class="sm muted">one wall</text>
  <line x1="401" y1="152" x2="401" y2="176" class="edge" marker-end="url(#arrow)"/>
  <text x="40" y="200" text-anchor="start" class="sm accent-f">one shared trench label</text>
  <line x1="40" y1="208" x2="460" y2="208" class="accent"/>
  <line x1="250" y1="214" x2="250" y2="250" class="accent" marker-end="url(#arrow-a)"/>
  <text x="262" y="240" text-anchor="start" class="sm accent-f">merge, then register each face</text>
  <text x="600" y="66" text-anchor="start" class="bold sm">Registered into one trench</text>
  <rect x="570" y="105" width="260" height="190" class="fill"/>
  <rect x="610" y="140" width="180" height="120" class="panel"/>
  <text x="700" y="126" text-anchor="middle" class="sm">North</text>
  <text x="700" y="284" text-anchor="middle" class="sm">South</text>
  <text x="590" y="204" text-anchor="middle" class="sm">West</text>
  <text x="810" y="204" text-anchor="middle" class="sm">East</text>
  <text x="700" y="204" text-anchor="middle" class="sm muted">the pit</text>
  <line x1="570" y1="105" x2="570" y2="295" class="accent"/>
  <line x1="830" y1="105" x2="830" y2="295" class="accent"/>
  <line x1="570" y1="105" x2="830" y2="105" class="accent"/>
  <line x1="570" y1="295" x2="830" y2="295" class="accent"/>
  <text x="24" y="330" text-anchor="start" class="sm muted">Walls meet at a corner only when adjacent faces really share corner coordinates.</text>
  <text x="24" y="350" text-anchor="start" class="sm muted">A per-sheet starter config cannot know that, so it cannot check it for you.</text>
</svg>
