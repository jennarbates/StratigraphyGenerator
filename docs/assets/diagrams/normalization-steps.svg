<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d">
  <title id="t">The normalization steps</title>
  <desc id="d">A skewed scan, the same scan rotated to horizontal, and the result scaled against a known real-world width.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="960" height="350" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">Normalization repairs the sheet, never the geometry</text>
  <rect x="40" y="60" width="260" height="230" rx="6" class="panel"/>
  <text x="56" y="86" text-anchor="start" class="bold">As scanned</text>
  <g transform="rotate(-7 170 190)"><rect x="70" y="110" width="200" height="150" class="fill"/></g>
  <text x="56" y="278" text-anchor="start" class="sm muted">skewed on the platen</text>
  <line x1="312" y1="175" x2="344" y2="175" class="accent" marker-end="url(#arrow-a)"/>
  <rect x="356" y="60" width="260" height="230" rx="6" class="panel"/>
  <text x="372" y="86" text-anchor="start" class="bold">Deskewed</text>
  <rect x="386" y="110" width="200" height="150" class="fill"/>
  <text x="372" y="278" text-anchor="start" class="sm muted">rotated to the detected horizontal</text>
  <line x1="628" y1="175" x2="660" y2="175" class="accent" marker-end="url(#arrow-a)"/>
  <rect x="672" y="60" width="260" height="230" rx="6" class="panel"/>
  <text x="688" y="86" text-anchor="start" class="bold">Scaled</text>
  <rect x="702" y="110" width="200" height="150" class="fill"/>
  <line x1="702" y1="276" x2="902" y2="276" class="accent"/>
  <text x="802" y="268" text-anchor="middle" class="sm accent-f">known width</text>
  <text x="24" y="330" text-anchor="start" class="sm muted">Every step here changes how the sheet sits, not what it records. Boundary shapes are untouched.</text>
</svg>
