  <rect x="916" y="228" width="34" height="58" fill="var(--band-c)" stroke="var(--edge)" stroke-width="1.5"/>
  <text x="546" y="288" text-anchor="start" class="sm muted">classified cells; size depends on grid resolution</text>
  <text x="24" y="340" text-anchor="start" class="sm muted">The default gate covers 75,000 instances. Larger grids grow in binary size, memory, and slice work.</text>
</svg>
