<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d">
  <title id="t">How to read a Harris matrix</title>
  <desc id="d">A small Harris matrix with the youngest unit at the top and arrows running downward to progressively older units.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="1000" height="390" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">Reading a Harris matrix</text>
  <rect x="352" y="48" width="136" height="44" rx="6" class="panel"/>
  <text x="420" y="75" text-anchor="middle" class="sm bold">Topsoil</text>
  <rect x="232" y="128" width="136" height="44" rx="6" class="panel"/>
  <text x="300" y="155" text-anchor="middle" class="sm bold">Fill 2</text>
  <rect x="472" y="128" width="136" height="44" rx="6" class="panel"/>
  <text x="540" y="155" text-anchor="middle" class="sm bold">Fill 3</text>
  <rect x="352" y="208" width="136" height="44" rx="6" class="panel"/>
  <text x="420" y="235" text-anchor="middle" class="sm bold">Floor 4</text>
  <rect x="352" y="288" width="136" height="44" rx="6" class="panel"/>
  <text x="420" y="315" text-anchor="middle" class="sm bold">Natural 5</text>
  <line x1="420" y1="92" x2="300" y2="128" class="edge" marker-end="url(#arrow)"/>
  <line x1="420" y1="92" x2="540" y2="128" class="edge" marker-end="url(#arrow)"/>
  <line x1="300" y1="172" x2="420" y2="208" class="edge" marker-end="url(#arrow)"/>
  <line x1="540" y1="172" x2="420" y2="208" class="edge" marker-end="url(#arrow)"/>
  <line x1="420" y1="252" x2="420" y2="288" class="edge" marker-end="url(#arrow)"/>
  <line x1="150" y1="70" x2="150" y2="320" class="accent" marker-end="url(#arrow-a)"/>
  <text x="140" y="70" text-anchor="end" class="sm accent-f">younger</text>
  <text x="140" y="320" text-anchor="end" class="sm accent-f">older</text>
  <text x="660" y="120" text-anchor="start" class="sm">Every arrow runs from a younger</text>
  <text x="660" y="140" text-anchor="start" class="sm">unit to an older one, so the</text>
  <text x="660" y="160" text-anchor="start" class="sm">youngest sit at the top.</text>
  <text x="660" y="200" text-anchor="start" class="sm">Two units side by side are not</text>
  <text x="660" y="220" text-anchor="start" class="sm">dated relative to each other.</text>
  <text x="660" y="240" text-anchor="start" class="sm">The matrix records only what</text>
  <text x="660" y="260" text-anchor="start" class="sm">the stratigraphy actually shows.</text>
  <text x="24" y="370" text-anchor="start" class="sm muted">The matrix is an archaeological interpretation, not an automatically verified result.</text>
</svg>
