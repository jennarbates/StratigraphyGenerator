site_name: Poggio Civitate Trench Digitization Guide
site_description: Guidance for turning trench-profile drawings into 3D geological models.
site_url: https://jennarbates.github.io/StratigraphyGenerator/
repo_url: https://github.com/jennarbates/StratigraphyGenerator
edit_uri: edit/main/docs/

theme:
  name: material
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - content.code.annotate
    - content.tabs.link
    # Nearly fifty pages across six sections need real navigation, not one
    # long sidebar: tabs for the sections, collapsible groups within them.
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

# Each of these enhances static markup that already stands on its own, so a
# reader with JavaScript disabled loses the interaction, not the content.
extra_javascript:
  - javascripts/coordinate-converter.mjs
  - javascripts/image-compare.mjs
  - javascripts/pipeline-explorer.mjs

exclude_docs: |
  _meta/

# The gradebook records one reader's own exam scores, so it is the one page of
# the learning course that stays off the published site. Draft pages are
# rendered by `mkdocs serve` and excluded from `mkdocs build`.
# tools/docs/mkdocs_hooks.py adds it to the navigation during serve, and
# check_docs.py exempts draft pages from its orphan check.
draft_docs: |
  learning/gradebook.md

hooks:
  - tools/docs/mkdocs_hooks.py

