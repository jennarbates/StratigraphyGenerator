<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
  <title id="t">Boundaries and the layers between them</title>
  <desc id="d">Three stratigraphic layers with the two traced boundaries highlighted, showing that a layer is the region between consecutive boundaries.</desc>
  <style>
:root {
  --bg: #ffffff; --ink: #1b1b1b; --muted: #5c5c5c; --line: #6b6b6b;
  --panel: #f7f9fb; --fill: #e8edf2; --edge: #b3bcc5;
  --accent: #1f6feb; --warn: #a8481a; --good: #266048;
  --band-a: #ddcdb2; --band-b: #c8ae80; --band-c: #ac8f63; --band-d: #8f7248;
}
text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
       fill: var(--ink); font-size: 15px; }
.sm { font-size: 13px; }
.muted { fill: var(--muted); }
.bold { font-weight: 650; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.panel { fill: var(--panel); stroke: var(--edge); stroke-width: 1.5; }
.fill { fill: var(--fill); stroke: var(--edge); stroke-width: 1.5; }
.edge { fill: none; stroke: var(--line); stroke-width: 2; }
.thin { fill: none; stroke: var(--edge); stroke-width: 1; }
.accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.accent-f { fill: var(--accent); }
.warn { stroke: var(--warn); fill: none; stroke-width: 2.5; }
.warn-f { fill: var(--warn); }
.good { stroke: var(--good); fill: none; stroke-width: 2.5; }
.good-f { fill: var(--good); }
.dash { stroke-dasharray: 6 4; }
.dot { stroke-dasharray: 2 3; }
</style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="var(--bg)"/>
  <text x="24" y="30" text-anchor="start" class="bold">You trace boundaries. A layer is what lies between two.</text>
  <rect x="60" y="70" width="400" height="70" fill="var(--band-a)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="60" y="140" width="400" height="90" fill="var(--band-b)" stroke="var(--edge)" stroke-width="1.5"/>
  <rect x="60" y="230" width="400" height="70" fill="var(--band-c)" stroke="var(--edge)" stroke-width="1.5"/>
  <path d="M60,140 Q93.33333333333334,146 126.66666666666667,140 Q160.0,134 193.33333333333334,140 Q226.66666666666669,146 260.0,140 Q293.33333333333337,134 326.6666666666667,140 Q360.0,146 393.33333333333337,140 Q426.6666666666667,134 460.0,140" class="accent"/>
  <path d="M60,230 Q93.33333333333334,236 126.66666666666667,230 Q160.0,224 193.33333333333334,230 Q226.66666666666669,236 260.0,230 Q293.33333333333337,224 326.6666666666667,230 Q360.0,236 393.33333333333337,230 Q426.6666666666667,224 460.0,230" class="accent"/>
  <text x="480" y="78" text-anchor="start" class="sm muted">top of the drawing</text>
  <line x1="560" y1="140" x2="470" y2="140" class="accent" marker-end="url(#arrow-a)"/>
  <text x="570" y="145" text-anchor="start" class="accent-f">boundary you trace</text>
  <line x1="560" y1="232" x2="470" y2="232" class="accent" marker-end="url(#arrow-a)"/>
  <text x="570" y="237" text-anchor="start" class="accent-f">the next boundary down</text>
  <line x1="500" y1="150" x2="500" y2="222" class="edge"/>
  <line x1="492" y1="150" x2="508" y2="150" class="edge"/>
  <line x1="492" y1="222" x2="508" y2="222" class="edge"/>
  <text x="516" y="190" text-anchor="start">the layer between them</text>
  <text x="24" y="340" text-anchor="start" class="sm muted">A layer is never traced directly. It is defined by the boundary above it</text>
  <text x="24" y="360" text-anchor="start" class="sm muted">and the boundary below it, which is why boundary order matters.</text>
</svg>
